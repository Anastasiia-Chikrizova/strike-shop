# Development stack: source is bind-mounted, both apps run their own watcher.
# Nothing here is built into an image — that is docker-compose.yml (local) and
# .github/workflows/build-push.yml (CI).

name: strike-shop-local

# Dev logs are noisy and worthless after a restart, so rotate them tighter
# than staging.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '20m'
    max-file: '2'

# Deliberately looser than staging: these containers install dependencies and
# compile on every change, which prod containers never do. The point here is
# only to stop one runaway process from taking the whole laptop down.
x-dev-resources: &dev-resources
  resources:
    limits:
      cpus: '${DEV_APP_CPUS:-2.0}'
      memory: ${DEV_APP_MEMORY:-2g}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${LOCAL_DB_USER:-medusa}
      POSTGRES_DB: ${LOCAL_DB_NAME:-medusa-strike-shop}
      # Passwordless is acceptable only because the port below is bound to
      # 127.0.0.1. Never carry this into staging or prod, where
      # POSTGRES_PASSWORD is required.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${LOCAL_DB_USER:-medusa}']
      interval: 5s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512m
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256m
    restart: unless-stopped
    logging: *default-logging

  backend:
    image: node:22-alpine
    working_dir: /repo
    environment:
      DATABASE_URL: postgres://${LOCAL_DB_USER:-medusa}@postgres:5432/${LOCAL_DB_NAME:-medusa-strike-shop}
      REDIS_URL: redis://redis:6379
      STORE_CORS: http://localhost:8000
      ADMIN_CORS: http://localhost:5173,http://localhost:9000
      AUTH_CORS: http://localhost:5173,http://localhost:9000,http://localhost:8000
      JWT_SECRET: ${JWT_SECRET:-local_dev_jwt}
      COOKIE_SECRET: ${COOKIE_SECRET:-local_dev_cookie}
    volumes:
      - .:/repo
      # Named volumes shadow the bind mount so host node_modules (built for
      # macOS) never leak into the Linux container.
      - backend_root_modules:/repo/node_modules
      - backend_app_modules:/repo/apps/backend/node_modules
    ports:
      - '127.0.0.1:9000:9000'
    command: >
      sh -c "[ -e node_modules/.package-lock.json ] || npm ci --no-audit --no-fund;
             npm run dev --workspace=@dtc/backend"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy: *dev-resources
    restart: unless-stopped
    logging: *default-logging

  storefront:
    image: node:22-alpine
    working_dir: /repo
    environment:
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://localhost:9000
      MEDUSA_BACKEND_URL: http://backend:9000
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${PUBLISHABLE_KEY:-}
      NEXT_PUBLIC_DEFAULT_REGION: ${DEFAULT_REGION:-ua}
    volumes:
      - .:/repo
      - storefront_root_modules:/repo/node_modules
      - storefront_app_modules:/repo/apps/storefront/node_modules
    ports:
      - '127.0.0.1:8000:8000'
    command: >
      sh -c "[ -e node_modules/.package-lock.json ] || npm ci --workspace=@dtc/storefront --include-workspace-root --no-audit --no-fund;
             npm run dev --workspace=@dtc/storefront"
    depends_on:
      - backend
    deploy: *dev-resources
    restart: unless-stopped
    logging: *default-logging

volumes:
  pgdata:
  redisdata:
  backend_root_modules:
  backend_app_modules:
  storefront_root_modules:
  storefront_app_modules:
