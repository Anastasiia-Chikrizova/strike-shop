name: build storefront

on:
  workflow_call:
    inputs:
      app_env:
        required: true
        type: string
      img_prefix:
        required: true
        type: string
    secrets:
      STOREFRONT_ENV:
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npx turbo lint --filter=@dtc/storefront
      - name: Typecheck
        env:
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_ci_placeholder
        run: npx turbo typecheck --filter=@dtc/storefront

  build:
    needs: lint
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    environment: ${{ inputs.app_env }}

    env:
      APP_ENV: ${{ inputs.app_env }}
      PLATFORM: linux/arm64

    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::814454905474:role/strike-shop-prod-github-build
          aws-region: eu-north-1

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v4
      - name: Write storefront env to file
        id: env_file
        env:
          STOREFRONT_ENV: ${{ secrets.STOREFRONT_ENV }}
        run: |
          printf '%s' "$STOREFRONT_ENV" > /tmp/storefront.env
          test -s /tmp/storefront.env
          echo "hash=$(sha256sum /tmp/storefront.env | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Storefront
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/storefront/Dockerfile
          platforms: ${{ env.PLATFORM }}
          build-args: |
            APP_ENV=${{ env.APP_ENV }}
            STOREFRONT_ENV_HASH=${{ steps.env_file.outputs.hash }}
          secret-files: |
            app_env=/tmp/storefront.env
          push: true
          tags: |
            ${{ inputs.img_prefix }}/storefront:${{ github.sha }}
            ${{ inputs.img_prefix }}/storefront:${{ env.APP_ENV }}
          cache-from: type=gha,scope=storefront-${{ env.APP_ENV }}
          cache-to: type=gha,scope=storefront-${{ env.APP_ENV }},mode=max

      - name: Clean up env file
        if: always()
        run: rm -f /tmp/storefront.env