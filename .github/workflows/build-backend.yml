name: build backend

on:
  workflow_call:
    inputs:
      app_env:
        required: true
        type: string
      img_prefix:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npx turbo lint --filter=@dtc/backend
      - name: Typecheck
        run: npx turbo typecheck --filter=@dtc/backend

  build:
    needs: lint
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    environment: ${{ inputs.app_env }}

    env:
      APP_ENV: ${{ inputs.app_env }}
      PLATFORM: linux/arm64

    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::814454905474:role/strike-shop-prod-github-deploy
          aws-region: eu-north-1

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v4

      - name: Backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/backend/Dockerfile
          platforms: ${{ env.PLATFORM }}
          build-args: APP_ENV=${{ env.APP_ENV }}
          push: true
          tags: |
            ${{ inputs.img_prefix }}/backend:${{ github.sha }}
            ${{ inputs.img_prefix }}/backend:${{ env.APP_ENV }}
          cache-from: type=gha,scope=backend-${{ env.APP_ENV }}
          cache-to: type=gha,scope=backend-${{ env.APP_ENV }},mode=max