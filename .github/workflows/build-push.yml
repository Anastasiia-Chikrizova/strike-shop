name: build & push to GHCR

on:
  push:
    branches: [dev, master]
  workflow_dispatch:
    inputs:
      environment:
        description: Куди збирати
        type: choice
        options: [staging, prod]
        default: staging

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    # Ampere A1 в Oracle — це arm64. Збираємо нативно на arm-раннері:
    # крос-збірка через QEMU задихається на нативних модулях бекенда.
    runs-on: ubuntu-24.04-arm

    # Секрет STOREFRONT_ENV береться з GitHub Environment з такою ж назвою.
    environment: ${{ inputs.environment || (github.ref_name == 'master' && 'prod') || 'staging' }}

    env:
      APP_ENV: ${{ inputs.environment || (github.ref_name == 'master' && 'prod') || 'staging' }}
      PLATFORM: linux/arm64

    steps:
      - uses: actions/checkout@v4

      # GHCR приймає тільки нижній регістр, а owner у нас з великих літер.
      - id: img
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # NEXT_PUBLIC_* вшиваються в бандл на збірці, тому env сторфронта
      # потрібен саме тут, а не на сервері.
      - name: Викласти env сторфронта у файл
        run: |
          printf '%s' "${{ secrets.STOREFRONT_ENV }}" > /tmp/storefront.env
          test -s /tmp/storefront.env

      - name: Backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          platforms: ${{ env.PLATFORM }}
          build-args: APP_ENV=${{ env.APP_ENV }}
          push: true
          tags: |
            ${{ steps.img.outputs.prefix }}/strike-backend:${{ github.sha }}
            ${{ steps.img.outputs.prefix }}/strike-backend:${{ env.APP_ENV }}
          cache-from: type=gha,scope=backend-${{ env.APP_ENV }}
          cache-to: type=gha,scope=backend-${{ env.APP_ENV }},mode=max

      - name: Storefront
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/storefront/Dockerfile
          platforms: ${{ env.PLATFORM }}
          build-args: APP_ENV=${{ env.APP_ENV }}
          secret-files: |
            app_env=/tmp/storefront.env
          push: true
          tags: |
            ${{ steps.img.outputs.prefix }}/strike-storefront:${{ github.sha }}
            ${{ steps.img.outputs.prefix }}/strike-storefront:${{ env.APP_ENV }}
          cache-from: type=gha,scope=storefront-${{ env.APP_ENV }}
          cache-to: type=gha,scope=storefront-${{ env.APP_ENV }},mode=max

      - name: Прибрати env-файл
        if: always()
        run: rm -f /tmp/storefront.env

      - name: Що зібрали
        run: |
          echo "### ${{ env.APP_ENV }} → ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.img.outputs.prefix }}/strike-backend:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.img.outputs.prefix }}/strike-storefront:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
