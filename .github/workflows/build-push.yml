name: build & push to GHCR

on:
  push:
    branches: [dev, master]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, prod]
        default: staging

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  setup:
    runs-on: ubuntu-24.04
    outputs:
      app_env: ${{ steps.vars.outputs.app_env }}
      img_prefix: ${{ steps.vars.outputs.img_prefix }}
      backend_changed: ${{ steps.filter.outputs.backend }}
      storefront_changed: ${{ steps.filter.outputs.storefront }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'push'

      - id: filter
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - 'apps/backend/**'
              - 'package.json'
              - 'package-lock.json'
            storefront:
              - 'apps/storefront/**'
              - 'package.json'
              - 'package-lock.json'

      - id: vars
        run: |
          echo "app_env=${{ inputs.environment || (github.ref_name == 'master' && 'prod') || 'staging' }}" >> "$GITHUB_OUTPUT"
          echo "img_prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

  backend:
    needs: setup
    if: github.event_name == 'workflow_dispatch' || needs.setup.outputs.backend_changed == 'true'
    runs-on: ubuntu-24.04
    environment: ${{ needs.setup.outputs.app_env }}

    env:
      APP_ENV: ${{ needs.setup.outputs.app_env }}
      PLATFORM: linux/amd64

    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/backend/Dockerfile
          platforms: ${{ env.PLATFORM }}
          build-args: APP_ENV=${{ env.APP_ENV }}
          push: true
          tags: |
            ${{ needs.setup.outputs.img_prefix }}/strike-backend:${{ github.sha }}
            ${{ needs.setup.outputs.img_prefix }}/strike-backend:${{ env.APP_ENV }}
          cache-from: type=gha,scope=backend-${{ env.APP_ENV }}
          cache-to: type=gha,scope=backend-${{ env.APP_ENV }},mode=max

  storefront:
    needs: setup
    if: github.event_name == 'workflow_dispatch' || needs.setup.outputs.storefront_changed == 'true'
    runs-on: ubuntu-24.04
    environment: ${{ needs.setup.outputs.app_env }}

    env:
      APP_ENV: ${{ needs.setup.outputs.app_env }}
      PLATFORM: linux/amd64

    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4
      - name: Write storefront env to file
        id: env_file
        run: |
          printf '%s' "${{ secrets.STOREFRONT_ENV }}" > /tmp/storefront.env
          test -s /tmp/storefront.env
          echo "hash=$(sha256sum /tmp/storefront.env | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Storefront
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/storefront/Dockerfile
          platforms: ${{ env.PLATFORM }}
          build-args: |
            APP_ENV=${{ env.APP_ENV }}
            STOREFRONT_ENV_HASH=${{ steps.env_file.outputs.hash }}
          secret-files: |
            app_env=/tmp/storefront.env
          push: true
          tags: |
            ${{ needs.setup.outputs.img_prefix }}/strike-storefront:${{ github.sha }}
            ${{ needs.setup.outputs.img_prefix }}/strike-storefront:${{ env.APP_ENV }}
          cache-from: type=gha,scope=storefront-${{ env.APP_ENV }}
          cache-to: type=gha,scope=storefront-${{ env.APP_ENV }},mode=max

      - name: Clean up env file
        if: always()
        run: rm -f /tmp/storefront.env

  summary:
    needs: [setup, backend, storefront]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: What was built
        run: |
          echo "### ${{ needs.setup.outputs.app_env }} → ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ needs.backend.result }}" = "success" ]; then
            echo "${{ needs.setup.outputs.img_prefix }}/strike-backend:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "backend: skipped, no changes under apps/backend" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ needs.storefront.result }}" = "success" ]; then
            echo "${{ needs.setup.outputs.img_prefix }}/strike-storefront:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "storefront: skipped, no changes under apps/storefront" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
