name: build & push to ECR

on:
  pull_request:
  push:
    branches: [eks, main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [eks, prod]
        default: eks

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  setup:
    runs-on: ubuntu-24.04
    outputs:
      app_env: ${{ steps.vars.outputs.app_env }}
      img_prefix: ${{ steps.vars.outputs.img_prefix }}
      backend_changed: ${{ steps.filter.outputs.backend }}
      storefront_changed: ${{ steps.filter.outputs.storefront }}
    steps:
      - uses: actions/checkout@v7

      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - 'apps/backend/**'
              - 'package.json'
              - 'package-lock.json'
            storefront:
              - 'apps/storefront/**'
              - 'package.json'
              - 'package-lock.json'

      - id: vars
        run: |
          echo "app_env=${{ inputs.environment || (github.ref_name == 'main' && 'prod') || 'eks' }}" >> "$GITHUB_OUTPUT"
          echo "img_prefix=814454905474.dkr.ecr.eu-north-1.amazonaws.com/strike-shop" >> "$GITHUB_OUTPUT"

  backend:
    needs: setup
    if: needs.setup.outputs.backend_changed == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/build-backend.yml
    with:
      app_env: ${{ needs.setup.outputs.app_env }}
      img_prefix: ${{ needs.setup.outputs.img_prefix }}

  storefront:
    needs: setup
    if: needs.setup.outputs.storefront_changed == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/build-storefront.yml
    with:
      app_env: ${{ needs.setup.outputs.app_env }}
      img_prefix: ${{ needs.setup.outputs.img_prefix }}
    secrets:
      STOREFRONT_ENV: ${{ secrets.STOREFRONT_ENV }}

  summary:
    needs: [setup, backend, storefront]
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    steps:
      - name: What was built
        run: |
          echo "### ${{ needs.setup.outputs.app_env }} → ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ needs.backend.result }}" = "success" ]; then
            echo "${{ needs.setup.outputs.img_prefix }}/backend:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ needs.backend.result }}" = "skipped" ]; then
            echo "backend: skipped, no changes under apps/backend" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "backend: failed (lint/typecheck or build)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ needs.storefront.result }}" = "success" ]; then
            echo "${{ needs.setup.outputs.img_prefix }}/storefront:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ needs.storefront.result }}" = "skipped" ]; then
            echo "storefront: skipped, no changes under apps/storefront" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "storefront: failed (lint/typecheck or build)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: [setup, backend, storefront]
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      needs.setup.outputs.app_env == 'prod' &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped') &&
      (needs.storefront.result == 'success' || needs.storefront.result == 'skipped')
    runs-on: ubuntu-24.04
    concurrency:
      # Two deploys racing on the same instance can run migrations twice.
      # Queue instead of letting a newer push cancel an SSM command that's
      # already running on the box.
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::814454905474:role/strike-shop-prod-github-deploy
          aws-region: eu-north-1

      - name: Determine changed services
        id: services
        run: |
          SERVICES=""
          [ "${{ needs.backend.result }}" = "success" ] && SERVICES="backend"
          [ "${{ needs.storefront.result }}" = "success" ] && SERVICES="$SERVICES storefront"
          SERVICES="$(echo "$SERVICES" | xargs)"
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSM
        if: steps.services.outputs.services != ''
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=strike-shop-prod-app" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          [ "$INSTANCE_ID" != "None" ] || { echo "::error::no running instance tagged strike-shop-prod-app"; exit 1; }
          echo "Instance: $INSTANCE_ID"

          CMD="cd /opt/strike-shop && sudo -u ec2-user git fetch --depth=1 origin ${{ github.sha }} && sudo -u ec2-user git checkout ${{ github.sha }} && sudo TAG='${{ github.sha }}' SERVICES='${{ steps.services.outputs.services }}' ./deploy/deploy.sh"
          PARAMS=$(jq -n --arg cmd "$CMD" '{commands: [$cmd]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$PARAMS" \
            --query Command.CommandId --output text)

          echo "SSM command: $COMMAND_ID (services: ${{ steps.services.outputs.services }})"

          # aws ssm wait command-executed gives up after 100s (default 5s x 20
          # attempts) — real deploys (image pull, migrate, health check) run
          # well past that. Poll for a terminal status ourselves instead, and
          # print the invocation unconditionally so a timed-out or failed
          # deploy still shows its logs here.
          STATUS="InProgress"
          for _ in $(seq 1 180); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output text

          [ "$STATUS" = "Success" ]