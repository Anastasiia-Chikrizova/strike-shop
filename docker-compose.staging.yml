# Деплойний файл: нічого не збирає, тільки тягне готові образи з GHCR.
# Збірка живе в CI (.github/workflows/build-push.yml), локальна збірка —
# в docker-compose.yml. Запускати через deploy/deploy.sh.

name: strike-shop-${APP_ENV:?set APP_ENV=staging|prod}

x-logging: &default-logging
  driver: ${LOG_DRIVER:-json-file}
  options:
    max-size: '250m'
    max-file: '7'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medusa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-medusa}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-medusa} -d ${POSTGRES_DB:-medusa}']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    logging: *default-logging

  # One-shot: `docker compose run --rm migrate`. У профілі, щоб не піднімався
  # разом з `up`. Той самий образ, що й бекенд, — CLI лежить у ньому.
  migrate:
    profiles: [tools]
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE}
    env_file:
      - ${BACKEND_ENV_FILE:?set BACKEND_ENV_FILE}
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL}
    command: ['npx', 'medusa', 'db:migrate']
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    logging: *default-logging

  backend:
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE}
    env_file:
      - ${BACKEND_ENV_FILE:?set BACKEND_ENV_FILE}
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Назовні не публікуємо — ходити ззовні тільки через caddy.
    # Порт на 127.0.0.1 лишаємо для дебагу з самої машини.
    ports:
      - '127.0.0.1:${BACKEND_PORT:-9000}:9000'
    volumes:
      - backend-static:/app/static
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:9000/health']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped
    logging: *default-logging

  storefront:
    image: ${STOREFRONT_IMAGE:?set STOREFRONT_IMAGE}
    env_file:
      - ${STOREFRONT_ENV_FILE:?set STOREFRONT_ENV_FILE}
    environment:
      # SSR ходить у бекенд по внутрішній мережі, публічний URL тут не потрібен.
      MEDUSA_BACKEND_URL: ${MEDUSA_BACKEND_URL:-http://backend:9000}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '127.0.0.1:${STOREFRONT_PORT:-8000}:8000'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:8000/api/health']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging

  caddy:
    image: caddy:2-alpine
    environment:
      BACKEND_DOMAIN: ${BACKEND_DOMAIN:?set BACKEND_DOMAIN}
      STOREFRONT_DOMAIN: ${STOREFRONT_DOMAIN:?set STOREFRONT_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
      - storefront
    restart: unless-stopped
    logging: *default-logging

volumes:
  pgdata:
  redisdata:
  backend-static:
  caddy-data:
  caddy-config:
