# Deployment file: builds nothing, only pulls ready images from GHCR.
# Building lives in CI (.github/workflows/build-push.yml); local builds live
# in docker-compose.yml. Run this through deploy/deploy.sh.

name: strike-shop-${APP_ENV:?set APP_ENV=staging|prod}

# 50m x 3 files per service. With five services that caps disk usage at
# ~750 MB. The previous 250m x 7 allowed ~8.75 GB, which is most of a small
# EBS volume.
x-logging: &default-logging
  driver: ${LOG_DRIVER:-json-file}
  options:
    max-size: '${LOG_MAX_SIZE:-50m}'
    max-file: '${LOG_MAX_FILE:-3}'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medusa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-medusa}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-medusa} -d ${POSTGRES_DB:-medusa}']
      interval: 5s
      timeout: 5s
      retries: 12
    # Limits are what makes instance sizing a calculation instead of a guess:
    # the sum below is the smallest box the stack fits on. Tune per
    # environment via stack.env, measure first with `docker stats`.
    deploy:
      resources:
        limits:
          cpus: '${POSTGRES_CPUS:-1.0}'
          memory: ${POSTGRES_MEMORY:-768m}
        reservations:
          memory: ${POSTGRES_MEMORY_MIN:-256m}
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: '${REDIS_CPUS:-0.5}'
          memory: ${REDIS_MEMORY:-256m}
    restart: unless-stopped
    logging: *default-logging

  # One-shot: `docker compose run --rm migrate`. Kept in a profile so it does
  # not come up with `up`. Same image as the backend — the CLI lives in it.
  migrate:
    profiles: [tools]
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE}
    env_file:
      - ${BACKEND_ENV_FILE:?set BACKEND_ENV_FILE}
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL}
    command: ['npx', 'medusa', 'db:migrate']
    depends_on:
      postgres:
        condition: service_healthy
    # Runs while the backend is down, so it may borrow the backend's budget.
    deploy:
      resources:
        limits:
          cpus: '${MIGRATE_CPUS:-1.5}'
          memory: ${MIGRATE_MEMORY:-1g}
    restart: 'no'
    logging: *default-logging

  backend:
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE}
    env_file:
      - ${BACKEND_ENV_FILE:?set BACKEND_ENV_FILE}
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Not published externally — outside traffic goes through caddy only.
    # The port stays bound to 127.0.0.1 for debugging from the box itself.
    ports:
      - '127.0.0.1:${BACKEND_PORT:-9000}:9000'
    volumes:
      - backend-static:/app/static
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:9000/health']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    # Medusa runs API and background jobs in one process
    # (MEDUSA_WORKER_MODE=shared), so it gets the largest share.
    deploy:
      resources:
        limits:
          cpus: '${BACKEND_CPUS:-1.5}'
          memory: ${BACKEND_MEMORY:-1536m}
        reservations:
          memory: ${BACKEND_MEMORY_MIN:-512m}
    restart: unless-stopped
    logging: *default-logging

  storefront:
    image: ${STOREFRONT_IMAGE:?set STOREFRONT_IMAGE}
    env_file:
      - ${STOREFRONT_ENV_FILE:?set STOREFRONT_ENV_FILE}
    environment:
      # SSR reaches the backend over the internal network; the public URL is
      # not needed here.
      MEDUSA_BACKEND_URL: ${MEDUSA_BACKEND_URL:-http://backend:9000}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '127.0.0.1:${STOREFRONT_PORT:-8000}:8000'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:8000/api/health']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # Already-built standalone output — it only serves, never compiles.
    deploy:
      resources:
        limits:
          cpus: '${STOREFRONT_CPUS:-1.0}'
          memory: ${STOREFRONT_MEMORY:-768m}
        reservations:
          memory: ${STOREFRONT_MEMORY_MIN:-256m}
    restart: unless-stopped
    logging: *default-logging

  caddy:
    image: caddy:2-alpine
    environment:
      BACKEND_DOMAIN: ${BACKEND_DOMAIN:?set BACKEND_DOMAIN}
      STOREFRONT_DOMAIN: ${STOREFRONT_DOMAIN:?set STOREFRONT_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
      - storefront
    deploy:
      resources:
        limits:
          cpus: '${CADDY_CPUS:-0.5}'
          memory: ${CADDY_MEMORY:-128m}
    restart: unless-stopped
    logging: *default-logging

volumes:
  pgdata:
  redisdata:
  backend-static:
  caddy-data:
  caddy-config:
